<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Permite tildes, eñes y caracteres en español -->
    <meta charset="UTF-8" />
    <!-- Hace que la página se adapte bien a distintas pantallas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Acme School</title>
    <!-- Enlaza los estilos principales dentro de la carpeta styles -->
    <link rel="stylesheet" href="./styles/main.css" />
    <!-- Enlaza los temas visuales dentro de la carpeta styles -->
    <link rel="stylesheet" href="./styles/themes.css" />
  </head>
  <body>
    <!-- Web Component para la barra de navegación superior -->
    <navbar-component id="mainNavbar"></navbar-component>

    <!-- Contenedor principal donde se irán dibujando las vistas -->
    <main id="appContainer"></main>

    <!-- Carga app.js como módulo ES desde la raíz del proyecto -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
